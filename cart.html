<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panier — FIZYX</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --black:#0a0a0a;
  --dark:#111;
  --gold:#b8975a;
  --white:#fff;
  --gray:#888;
}

body{
  font-family:'Montserrat',sans-serif;
  background:var(--black);
  color:var(--white);
}

/* NAV */
nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:#0d0d0d;
}

.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:30px;
  letter-spacing:3px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:13px;
}

/* PAGE */
.cart-page{
  padding:80px 60px;
}

.cart-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:70px;
  letter-spacing:3px;
  margin-bottom:50px;
}

/* CART */
.cart-container{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
}

/* IMPORTANT FIX */
.cart-items{
  background:#111;
  border:1px solid rgba(255,255,255,.05);
  min-height:200px;
}

/* ITEM */
.cart-item{
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.cart-item img{
  width:120px;
  height:140px;
  object-fit:cover;
}

.item-info{flex:1}

.item-category{
  font-size:11px;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.item-name{
  font-size:24px;
  font-family:'Bebas Neue',sans-serif;
}

.item-price{
  margin-top:10px;
  color:#ccc;
}

.remove-btn{
  background:none;
  border:none;
  color:#999;
  cursor:pointer;
}

.remove-btn:hover{
  color:red;
}

/* SUMMARY */
.cart-summary{
  background:#111;
  border:1px solid rgba(255,255,255,.05);
  padding:30px;
}

.summary-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;
  margin-bottom:25px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
  color:#ccc;
}

.total{
  font-size:18px;
  color:white;
  font-weight:600;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.08);
}

.checkout-btn{
  width:100%;
  margin-top:30px;
  height:52px;
  border:none;
  background:var(--gold);
  color:black;
  font-weight:700;
  cursor:pointer;
}

.checkout-btn:hover{
  opacity:.9;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px;
}

@media(max-width:900px){
  .cart-container{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<nav>
  <div class="logo">FIZYX</div>
  <a href="boutique.html">← Retour Boutique</a>
</nav>

<section class="cart-page">

  <h1 class="cart-title">Votre Panier</h1>

  <div class="cart-container">

    <!-- CART ITEMS (IMPORTANT ID) -->
    <div class="cart-items" id="cartItems"></div>

    <!-- SUMMARY -->
    <div class="cart-summary">

      <h2 class="summary-title">Résumé</h2>

      <div class="summary-row">
        <span>Sous-total</span>
        <span id="subtotal">0 DH</span>
      </div>

      <div class="summary-row">
        <span>Livraison</span>
        <span>Gratuite</span>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span id="total">0 DH</span>
      </div>

      <button class="checkout-btn">Commander</button>

    </div>

  </div>

</section>

<!-- IMPORTANT -->
<script src="cart.js"></script>

</body>
</html>
